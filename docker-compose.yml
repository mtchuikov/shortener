networks:
  postgres:
    external: true

volumes:
  postgres_data:
    external: true

  pgadmin_data:
    external: true

services:
  postgres:
    image: postgres
    container_name: postgres
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres

  shortener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortener
    depends_on:
      - postgres
    ports:
      - 127.0.0.1:8080:8080
    environment:
      DATABASE_DSN: postgres://user:password@postgres:5432/postgres?sslmode=disable
    networks:
      - postgres